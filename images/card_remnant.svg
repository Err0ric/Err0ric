<svg width="290" height="118" viewBox="0 0 290 118" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#140a2c"/>
    <stop offset="100%" stop-color="#0d0720"/>
  </linearGradient>
  <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6d28d9"/>
    <stop offset="50%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#6d28d9"/>
  </linearGradient>
  <pattern id="scan" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
    <rect width="2" height="1" fill="rgba(139,92,246,0.05)"/>
  </pattern>
</defs>
<style>
  @keyframes shimmer { 0%{opacity:.55} 50%{opacity:1} 100%{opacity:.55} }
  @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:.25} }
  @keyframes sweep   { 0%{transform:translateX(-290px)} 100%{transform:translateX(290px)} }
  .bar  { animation: shimmer 3s ease-in-out infinite; }
  .dot  { animation: blink 2s ease-in-out infinite; }
  .sweep{ animation: sweep 6s linear infinite; }
</style>
<rect width="290" height="118" rx="8" fill="url(#bg)" stroke="#3b1680" stroke-width="1.5"/>
<rect width="290" height="118" rx="8" fill="url(#scan)"/>
<rect class="bar" x="0" y="0" width="290" height="3" rx="1.5" fill="url(#bar)"/>
<!-- faint light sweep -->
<rect class="sweep" x="0" y="0" width="60" height="118" fill="#8b5cf6" opacity="0.06"/>
<!-- bracket corner -->
<path d="M12,106 L12,90 M12,106 L28,106" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.5"/>
<path d="M278,16 L278,32 M278,16 L262,16" stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.5"/>
<!-- status -->
<circle class="dot" cx="20" cy="26" r="4" fill="#fbbf24"/>
<text x="30" y="30" font-family="'Courier New','Lucida Console',monospace" font-size="10" fill="#fbbf24" letter-spacing="1.5">BUILDING</text>
<!-- name -->
<text x="18" y="60" font-family="'Courier New','Lucida Console',monospace" font-size="19" font-weight="700" fill="#ffffff">Remnant</text>
<!-- tagline -->
<text x="18" y="80" font-family="'Courier New','Lucida Console',monospace" font-size="11" fill="#c4b5fd">self-hosted AI usage monitoring</text>
<!-- stack -->
<text x="18" y="100" font-family="'Courier New','Lucida Console',monospace" font-size="9.5" fill="#7c6aa8">shadow AI · agents · MCP</text>
<text x="272" y="100" font-family="'Courier New','Lucida Console',monospace" font-size="9.5" fill="#7c6aa8" text-anchor="end">&gt;_</text>
</svg>
