<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120830" />
      <stop offset="60%" stop-color="#1a0a35" />
      <stop offset="100%" stop-color="#0d0720" />
    </linearGradient>
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1060" />
      <stop offset="100%" stop-color="#1e0a40" />
    </linearGradient>
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1d96" />
      <stop offset="100%" stop-color="#3b1680" />
    </linearGradient>
    <linearGradient id="wave3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <pattern id="scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="1" fill="rgba(139,92,246,0.04)" />
    </pattern>
  </defs>

  <style>
    /* Same wave motion as the header, flipped so the waves rise from the bottom */
    @keyframes cursorBlink { 0%,49%{opacity:0.9} 50%,100%{opacity:0} }
    .cursor { animation: cursorBlink 1.1s step-end infinite; }
  </style>

  <rect width="900" height="120" fill="url(#bgGrad)" />
  <rect width="900" height="120" fill="url(#scanlines)" />

  <!-- top accent bar, same shimmer as the header's bottom bar -->
  <rect x="0" y="0" width="900" height="13" fill="#7c3aed" opacity="0.95" />
  <rect x="0" y="0" width="900" height="13" opacity="0.5">
    <animate attributeName="fill" values="#8b5cf6;#a78bfa;#c4b5fd;#a78bfa;#8b5cf6" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- sign-off line -->
  <text x="30" y="42" font-family="'Courier New', 'Lucida Console', monospace" font-size="11" fill="#a78bfa" opacity="0.7">err0ric@toaster:~$ exit</text>
  <rect class="cursor" x="186" y="32" width="7" height="12" fill="#8b5cf6" rx="1" opacity="0.9" />
  <text x="870" y="42" font-family="'Courier New', 'Lucida Console', monospace" font-size="10" fill="#a78bfa" text-anchor="end" opacity="0.5">[ session closed ]</text>

  <!-- waves rising from the bottom -->
  <path class="wave1" d="M-100,120 L1000,120 L1000,65 Q850,35 700,60 Q550,85 400,50 Q250,20 100,55 Q0,75 -100,60 Z" fill="url(#wave1Grad)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0;0.33;0.66;1.0" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="M-100,120 L1000,120 L1000,65 Q850,35 700,60 Q550,85 400,50 Q250,20 100,55 Q0,75 -100,60 Z;M-100,120 L1000,120 L1000,65 Q850,80 700,45 Q550,20 400,65 Q250,90 100,45 Q0,30 -100,65 Z;M-100,120 L1000,120 L1000,65 Q850,50 700,75 Q550,100 400,60 Q250,32 100,70 Q0,85 -100,55 Z;M-100,120 L1000,120 L1000,65 Q850,35 700,60 Q550,85 400,50 Q250,20 100,55 Q0,75 -100,60 Z" />
  </path>
  <path class="wave2" d="M-100,120 L1000,120 L1000,75 Q850,45 700,72 Q550,98 400,62 Q250,35 100,68 Q0,85 -100,72 Z" fill="url(#wave2Grad)">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0;0.33;0.66;1.0" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="M-100,120 L1000,120 L1000,75 Q850,45 700,72 Q550,98 400,62 Q250,35 100,68 Q0,85 -100,72 Z;M-100,120 L1000,120 L1000,75 Q850,90 700,58 Q550,32 400,75 Q250,102 100,60 Q0,42 -100,78 Z;M-100,120 L1000,120 L1000,75 Q850,60 700,85 Q550,108 400,70 Q250,45 100,82 Q0,98 -100,65 Z;M-100,120 L1000,120 L1000,75 Q850,45 700,72 Q550,98 400,62 Q250,35 100,68 Q0,85 -100,72 Z" />
  </path>
  <path class="wave3" d="M-100,120 L1000,120 L1000,85 Q850,58 700,82 Q550,106 400,75 Q250,48 100,80 Q0,95 -100,82 Z" fill="url(#wave3Grad)">
    <animate attributeName="d" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0.0;0.33;0.66;1.0" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" values="M-100,120 L1000,120 L1000,85 Q850,58 700,82 Q550,106 400,75 Q250,48 100,80 Q0,95 -100,82 Z;M-100,120 L1000,120 L1000,85 Q850,102 700,70 Q550,46 400,86 Q250,112 100,72 Q0,55 -100,90 Z;M-100,120 L1000,120 L1000,85 Q850,70 700,95 Q550,118 400,80 Q250,55 100,92 Q0,108 -100,75 Z;M-100,120 L1000,120 L1000,85 Q850,58 700,82 Q550,106 400,75 Q250,48 100,80 Q0,95 -100,82 Z" />
  </path>
</svg>
